# Runs coverage tests. Will stage a comment to be posted with coverage result as PR comment
# On push to main uploads result files (e.g. badge) to orphan branch "python-coverage-mds-toolkit-data" 
name: Build

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  test:
    name: Run tests & display coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
    
      - name: Install dependencies
        run: |
          uv venv
          uv pip install setuptools
          uv sync

      - name: Test with coverage
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python-version }}
        run: uv run coverage run -m pytest atmos_validation

      - name: Store coverage file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}
          include-hidden-files: true

  coverage:
      name: Coverage
      runs-on: ubuntu-latest
      needs: test
      permissions:
        pull-requests: write
        contents: read
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
          id: download
          with:
            pattern: coverage-*
            merge-multiple: true

        - name: Coverage comment
          id: coverage_comment
          uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71 # v4.3
          with:
            GITHUB_TOKEN: ${{ github.token }}
            MERGE_COVERAGE_FILES: true
            MINIMUM_GREEN: 90

        - name: Store Pull Request comment to be posted
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
          with:
            name: python-coverage-comment-action
            path: python-coverage-comment-action.txt
